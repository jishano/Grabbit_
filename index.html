function stockStatus(p){
if(p.unavailable)return{color:"#2c2c2c",label:"Not in stock"};
const m=p.stockUpdatedMins??5;
if(m<=15)return{color:"#2e7d32",label:"Updated "+m+"m ago"};
if(m<=60)return{color:"#e08a1e",label:"Updated "+m+"m ago"};
return{color:"#b23b3b",label:"⚠ Updated "+(m>=60?Math.round(m/60)+"h":m+"m")+" ago"};
}
function stockBadge(p){const s=stockStatus(p);return `<span class="stockdot" style="background:${s.color}"></span>${s.label}`}
function storeTopDeal(id){const items=products.filter(p=>p.store===id&&p.discount&&!p.unavailable);if(!items.length)return null;return items.reduce((a,b)=>b.discount>a.discount?b:a)}

/* Storage is wrapped in try/catch: some browsers (e.g. Safari on file:// pages,
   or sandboxed preview frames) throw when touching localStorage at all. If that
   happens we silently fall back to an in-memory store so the app keeps working
   for the session instead of erroring out on every cart action. */
const memoryStore={};
function storageGet(key){try{return localStorage.getItem(key)}catch(e){return memoryStore[key]??null}}
function storageSet(key,val){try{localStorage.setItem(key,val)}catch(e){memoryStore[key]=val}}

function save(){storageSet("grabbit_cart",JSON.stringify(cart));storageSet("grabbit_orders",JSON.stringify(orders));storageSet("grabbit_favs",JSON.stringify(favs))}
function getStore(id){return stores.find(s=>s.id===id)}
function getProduct(id){return products.find(p=>p.id===id)}
function money(n){return "₹"+n.toLocaleString("en-IN")}
function qty(id){const x=cart.find(a=>a.id===id);return x?x.qty:0}
function cartCount(){return cart.reduce((s,x)=>s+x.qty,0)}
function subtotal(){return cart.reduce((s,x)=>s+getProduct(x.id).price*x.qty,0)}
function currentCartStore(){return cart.length?getStore(getProduct(cart[0].id).store):null}
function deliveryFeeForCart(){const s=currentCartStore();return s&&s.delivery?(s.deliveryFee||0):0}
function orderGrandTotal(){return subtotal()+(selectedDelivery?deliveryFeeForCart():0)}
function notify(t){toast.textContent=t;toast.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>toast.classList.remove("show"),1800)}
function nav(r){lastRoute=route;route=r;render()}
function goBack(){nav(lastRoute||"home")}
function toggleFav(id){favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];save();notify(favs.includes(id)?"Added to favourites ♥":"Removed from favourites");render()}
function add(id,n=1){let x=cart.find(a=>a.id===id);if(x)x.qty+=n;else cart.push({id,qty:n});save();notify(getProduct(id).name+" added to cart ✓");render()}
function changeCart(id,n){const x=cart.find(a=>a.id===id);if(!x)return;x.qty+=n;if(x.qty<=0)cart=cart.filter(a=>a.id!==id);save();render()}
function clearCart(){cart=[];save()}
function toggleDelivery(){if(!deliveryFeeForCart())return;selectedDelivery=!selectedDelivery;notify(selectedDelivery?"Delivery added — "+money(deliveryFeeForCart())+" added to total":"Delivery removed");render()}
function storeCard(s){return `<article class="store" onclick="nav('store:${s.id}')"><div class="storepic" style="background-image:url('${s.img}')"><button class="heart" onclick="event.stopPropagation();toggleFav('${s.id}')">${favs.includes(s.id)?"♥":"♡"}</button></div><div class="storeinfo"><h3>${s.name}</h3><div class="meta">⌖ ${s.distance} from Christ College</div><div class="meta">★ ${s.rating} (${s.reviews})</div><div class="meta"><span class="activedot"></span>Active ${s.lastActiveMins}m ago${s.delivery?'<span class="deliverytag">🛵 Delivery</span>':''}</div><div class="meta">${s.cat}</div><span class="offer">${s.offer}</span></div></article>`}
function productCard(p){return `<article class="product" onclick="nav('product:${p.id}')">${productThumb(p,'productpic',46)}<div class="productbody"><h3>${p.name}</h3><div class="price">${money(p.price)}</div><div class="meta">${stockBadge(p)}</div><div class="productbottom"><span class="meta">★ 4.6</span><button class="add" onclick="event.stopPropagation();add('${p.id}')">Add +</button></div></div></article>`}
function navBar(active){return `<nav class="bottom">
<button class="nav ${active==='home'?'active':''}" onclick="nav('home')">⌂<small>Home</small></button>
<button class="nav ${active==='orders'?'active':''}" onclick="nav('orders')">▤<small>Orders</small></button>

function searchHome(q){const out=document.getElementById("searchOut");if(!out)return;if(!q.trim()){out.innerHTML="";return}let z=q.toLowerCase();let ss=stores.filter(s=>(s.name+" "+s.cat).toLowerCase().includes(z));let ps=products.filter(p=>p.name.toLowerCase().includes(z));out.innerHTML=`<div class="sectionhead"><h2>Search</h2></div>${ss.map(storeCard).join("")}${ps.length?`<div class="productgrid" style="margin-top:10px">${ps.map(productCard).join("")}</div>`:""}${!ss.length&&!ps.length?`<p class="meta">No results found.</p>`:""}`}

function miniMap(){return `<div class="mapbox"><div class="mapriver"></div><div class="you"></div><div class="you-label" style="left:47%;top:46%">Christ College</div>${[["m1","d1","50 m","christ"],["m2","d2","150 m","campus"],["m3","d3","500 m","akp"],["m4","d4","720 m","green"]].map(x=>`<button id="marker-${x[3]}" class="mapmarker ${x[0]}" onclick="event.stopPropagation();routeThenGo('${x[3]}')"><span>⌖</span>${getStore(x[3]).delivery?'<span class="deliverybadge">🛵</span>':''}</button><span class="distancepill ${x[1]}">${getStore(x[3]).name} • ${x[2]}</span>`).join("")}<div style="position:absolute;left:45%;top:42%;font-size:22px">🧍</div></div>`}
function mapPage(){return shell(`<div class="fullmap"><div class="maphero"><div class="maptop"><button class="mapback" onclick="goBack()">‹</button><div class="mapsearch"><span>⌕</span><input placeholder="Search stores on map..." oninput="mapSearch(this.value)"><button class="voice" onclick="voiceSearch()">🎙</button></div></div><div class="mapriver"></div><div class="you"></div><div class="you-label" style="left:48%;top:49%">Christ College</div>${[["m1","d1","50 m","christ"],["m2","d2","150 m","campus"],["m3","d3","500 m","akp"],["m4","d4","720 m","green"]].map(x=>`<button id="marker-${x[3]}" class="mapmarker ${x[0]}" onclick="routeThenGo('${x[3]}')"><span>⌖</span>${getStore(x[3]).delivery?'<span class="deliverybadge">🛵</span>':''}</button><span class="distancepill ${x[1]}">${getStore(x[3]).name} • ${x[2]}</span>`).join("")}<div style="position:absolute;left:47%;top:46%;font-size:25px">🧍</div><div class="mapcontrols"><button class="mapcontrol" onclick="notify('Your location centered')">◎</button><button class="mapcontrol" onclick="notify('Map zoomed in')">＋</button><button class="mapcontrol" onclick="notify('Map zoomed out')">−</button></div></div><div class="map-sheet"><h2>Stores near Christ College</h2><div class="meta">Distances are demo distances from the campus location.</div><div class="map-stores" id="mapStores">${stores.map(s=>`<button class="map-store" onclick="routeThenGo('${s.id}')"><strong>${s.name}${s.delivery?' 🛵':''}</strong><div class="dist">⌖ ${s.distance} away</div><div class="meta">${s.cat}</div></button>`).join("")}</div></div></div>`,'home',false)}
function mapSearch(q){const z=q.toLowerCase().trim();const a=stores.filter(s=>(s.name+s.cat).toLowerCase().includes(z));const el=document.getElementById('mapStores');if(el)el.innerHTML=a.map(s=>`<button class="map-store" onclick="routeThenGo('${s.id}')"><strong>${s.name}${s.delivery?' 🛵':''}</strong><div class="dist">⌖ ${s.distance} away</div><div class="meta">${s.cat}</div></button>`).join("")||`<div class="meta">No nearby store found.</div>`}
function voiceSearch(){const input=document.querySelector('#q, .mapsearch input');const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SpeechRecognition){notify('Voice search is not supported in this browser');return}const btn=document.querySelector('.voice');const rec=new SpeechRecognition();rec.lang='en-IN';rec.interimResults=false;rec.maxAlternatives=1;if(btn)btn.classList.add('listening');rec.onresult=e=>{const text=e.results[0][0].transcript;if(input){input.value=text;if(input.id==='q')searchHome(text);else mapSearch(text)}notify('Searching for "'+text+'"')};rec.onerror=()=>notify('Could not hear that — try again');rec.onend=()=>btn&&btn.classList.remove('listening');rec.start()}
function routeThenGo(storeId){
try{
const container=document.querySelector('.mapbox, .maphero');
const youEl=container?container.querySelector('.you'):null;
const markerEl=container?container.querySelector('#marker-'+storeId):null;
if(container&&youEl&&markerEl){
drawRoute(container,youEl,markerEl);
notify('Finding route to '+getStore(storeId).name+'…');
setTimeout(()=>nav('store:'+storeId),900);
return;
}
}catch(e){}
nav('store:'+storeId);
}
function drawRoute(container,fromEl,toEl){
const rect=container.getBoundingClientRect(),f=fromEl.getBoundingClientRect(),t=toEl.getBoundingClientRect();
const x1=f.left+f.width/2-rect.left,y1=f.top+f.height/2-rect.top,x2=t.left+t.width/2-rect.left,y2=t.top+t.height/2-rect.top;
const bend1x=x1+(x2-x1)*0.33+(Math.random()*70-35),bend1y=y1+(y2-y1)*0.33+(Math.random()*70-35);
const bend2x=x1+(x2-x1)*0.66+(Math.random()*70-35),bend2y=y1+(y2-y1)*0.66+(Math.random()*70-35);
let svg=container.querySelector('.route-svg');
if(!svg){svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','route-svg');container.appendChild(svg)}
svg.innerHTML='';
const path=document.createElementNS('http://www.w3.org/2000/svg','path');
path.setAttribute('d',`M ${x1} ${y1} C ${bend1x} ${bend1y}, ${bend2x} ${bend2y}, ${x2} ${y2}`);
path.setAttribute('class','route-path');
svg.appendChild(path);
const len=path.getTotalLength();
path.style.strokeDasharray=len;path.style.strokeDashoffset=len;
requestAnimationFrame(()=>{path.style.transition='stroke-dashoffset .8s ease';path.style.strokeDashoffset='0'});
}

function showProcessing(ms,done){
overlay.innerHTML=`<div class="loadingbox"><img class="mascot" src="${mascot}"><h2>Sending to Seller…</h2><p>Your request is on its way to the store for confirmation</p><div class="loader"><i></i></div><div class="count" id="loadCount">Please wait…</div></div>`;
overlay.scrollTop=0;
const bar=overlay.querySelector(".loader i"),count=overlay.querySelector("#loadCount");let start=Date.now();
let iv=setInterval(()=>{let pct=Math.min(100,((Date.now()-start)/ms)*100);bar.style.width=pct+"%";count.textContent=Math.ceil((ms-(Date.now()-start))/1000)+"s left";if(pct>=100){clearInterval(iv);setTimeout(()=>{overlay.innerHTML="";done()},200)}},100);
}
function showConfirmedStage(ms,done){
overlay.innerHTML=`<div class="confirm-cover"><img class="mascot-big" src="${mascot}"><h2>Seller Confirmed ✓</h2><p>Great news — your request was accepted. Preparing your order…</p></div>`;
setTimeout(()=>{overlay.innerHTML="";done()},ms);
}

}

function createOrder(status="confirmed",note=""){
const items=cart.map(x=>({id:x.id,qty:x.qty}));
const storeId=items.length?getProduct(items[0].id).store:"christ";
const s=getStore(storeId);
const delivery=selectedDelivery&&s.delivery;
const fee=delivery?(s.deliveryFee||0):0;
const total=subtotal()+fee;
const id="GRABBIT-"+Math.floor(100000+Math.random()*899999);
orders.unshift({id,store:storeId,total,items,pay:selectedPay,slot:selectedSlot,status,note,date:"Today",distance:s.distance,delivery,deliveryFee:fee});
clearCart();
selectedDelivery=false;
save();
nav("order:"+id)
}

<div class="statuscard"><strong>Pickup store</strong><h2 style="margin:5px 0;color:var(--plum)">${s.name}</h2><div class="meta">⌖ ${s.distance} from Christ College</div><div class="meta">Confirmed • ready for pickup scheduling</div>${pendingNote?`<div class="note" style="margin-top:12px">${pendingNote}</div>`:""}</div>
<div class="sectionhead"><h2>Payment Method</h2></div><div class="payment">${[["cod","💵","Pay on Pickup","Pay when you collect"],["upi","📱","UPI","Google Pay / PhonePe"],["card","💳","Credit / Debit Card","Secure demo payment"],["net","🏦","Net Banking","Bank transfer"]].map(x=>`<button class="pay ${selectedPay===x[0]?"selected":""}" onclick="selectPay('${x[0]}')"><strong>${x[1]} ${x[2]}</strong><span>${x[3]}</span></button>`).join("")}</div>
${canDeliver?`<div class="sectionhead"><h2>Delivery</h2></div><button class="pay ${selectedDelivery?"selected":""}" style="width:100%" onclick="toggleDelivery()"><strong>🛵 Delivery provided by seller — ${money(fee)}</strong><span>${selectedDelivery?"Selected • added to your total":"Tap to get this order delivered instead of picking it up"}</span></button>`:`<div class="sectionhead"><h2>Delivery</h2></div><p class="meta">${s.name} doesn't offer delivery yet — pickup only for this store.</p>`}
<div class="sectionhead"><h2>Pickup Preference</h2></div><div class="slot">${["Today • 4:00 PM – 5:00 PM","Today • 5:00 PM – 6:00 PM","Today • 6:00 PM – 7:00 PM"].map(x=>`<button class="${selectedSlot===x?"selected":""}" onclick="selectSlot('${x}')">${x}</button>`).join("")}</div>
<div class="summary"><div class="line"><span>Subtotal</span><strong>${money(subtotal())}</strong></div>${selectedDelivery?`<div class="line"><span>Delivery fee</span><strong>${money(fee)}</strong></div>`:""}<div class="line total"><span>Total</span><strong>${money(orderGrandTotal())}</strong></div><button class="primary" onclick="finalizeOrder()">Confirm & Place Order</button></div>`,"cart",true)
}
function finalizeOrder(){createOrder("confirmed",pendingNote);pendingNote="";}
function orderPage(id){
const o=orders.find(x=>x.id===id)||orders[0];if(!o)return nav("orders");const s=getStore(o.store);
return shell(`<div style="text-align:center;margin-bottom:6px"><img src="${mascot}" style="width:84px;height:66px;object-fit:cover;border-radius:12px"><div style="font:700 22px 'Playfair Display',serif;color:var(--plum);margin-top:2px">Grabbit</div></div><div class="pagehead"><h1>Order Confirmed ✓</h1><p>Your reservation is ready in your Grabbit order.</p></div>
<div class="statuscard"><div style="display:flex;justify-content:space-between"><strong>${s.name}</strong><span class="offer">${o.status==="confirmed"?"Confirmed":"Pending"}</span></div><div class="meta">⌖ ${s.distance} from Christ College</div><div class="meta">Pickup: ${o.slot}</div><div class="meta">Payment: ${o.pay==="cod"?"Pay on Pickup":o.pay.toUpperCase()}</div><div class="meta">${o.delivery?`🛵 Delivery selected • ${money(o.deliveryFee)} delivery fee`:"🏪 Self pickup at store"}</div>${o.note?`<div class="note" style="margin-top:12px">${o.note}</div>`:""}</div>
<div class="sectionhead"><h2>Pickup QR</h2><button class="link" onclick="notify('QR saved — demo')">Save</button></div><div class="qr" title="Demo QR"></div><p class="meta" style="text-align:center">Show this QR at the store when you collect your order.</p>
<div class="sectionhead"><h2>Pickup OTP</h2></div><div class="otp" id="otp">••••••</div><button class="secondary" style="width:100%" onclick="generateOtp('${o.id}')">Generate OTP</button>
<div class="sectionhead"><h2>Items</h2></div>${o.items.map(x=>{let p=getProduct(x.id);return `<div class="line"><span>${p.name} × ${x.qty}</span><strong>${money(p.price*x.qty)}</strong></div>`}).join("")}
<div class="summary">${o.delivery?`<div class="line"><span>Delivery fee</span><strong>${money(o.deliveryFee)}</strong></div>`:""}<div class="line total"><span>Total</span><strong>${money(o.total)}</strong></div></div>`,"orders",true)
}
function generateOtp(id){const otp=Math.floor(100000+Math.random()*900000);document.getElementById("otp").textContent=otp;notify("Pickup OTP generated")}
function ordersPage(){
return shell(`<div class="pagehead"><h1>Orders</h1><p>Your reservations, confirmations and pickup details.</p></div>${orders.length?orders.map(o=>{let s=getStore(o.store);return `<article class="order-card" style="background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:11px" onclick="nav('order:${o.id}')"><div style="display:flex;justify-content:space-between"><strong>${s.name}</strong><span class="offer">${o.status==="confirmed"?"Confirmed":"Pending"}</span></div><div class="meta">⌖ ${s.distance} from Christ College</div><div class="meta">${o.date} • ${o.slot}</div><div class="meta">${o.delivery?"🛵 Delivery":"🏪 Pickup"}</div><div class="line" style="margin-top:11px"><span>${o.items.length} product${o.items.length>1?"s":""}</span><strong>${money(o.total)}</strong></div><button class="secondary" style="width:100%;margin-top:6px">View QR & OTP →</button></article>`}).join(""):`<div class="summary"><h3>No orders yet</h3><p class="meta">Your confirmed reservations will appear here.</p><button class="primary" onclick="nav('discover')">Find a Store</button></div>`}`,"orders")
}
function loyalty(){return shell(`<div class="pagehead"><h1>Grabbit Loyalty</h1><p>Rewards for choosing local.</p></div><div class="points"><span>Current Points</span><strong>250</strong><span>250 / 500 points to next reward</span><div class="progress"><i></i></div></div><div class="sectionhead"><h2>Rewards</h2></div><div class="summary"><strong>₹50 Off</strong><div class="meta">500 points • 250 more to unlock</div></div><div class="summary"><strong>₹100 Off</strong><div class="meta">900 points • 650 more to unlock</div></div>`,"loyalty")}
function profile(){return shell(`<div class="profilecard"><div class="avatar" style="background-image:url('${profilePic}');background-size:cover;background-position:center"></div><div><h2 style="margin:0;color:var(--plum)">Jishan MJ</h2><div class="meta">Local shopper • 250 points</div></div></div>
<div class="sectionhead"><h2>Services</h2></div>
<div class="menu">
<button onclick="toggleServices()"><span>⚙ &nbsp;Services</span><span class="toggle-switch ${servicesOn?'on':''}" id="servicesToggle"><i></i></span></button>
<button onclick="notify('Opening Relief Reach — demo screen')"><span>🆘 &nbsp;Relief Reach</span><span>›</span></button>
</div>
<div class="sectionhead"><h2>Account</h2></div>
<div class="menu">${["My Orders","Loyalty Points","Addresses","Payment Methods","Notifications","Help & Support","Settings"].map((x,i)=>`<button onclick="${x==="My Orders"?"nav('orders')":x==="Loyalty Points"?"nav('loyalty')":"notify('"+x+" — demo screen')"}"><span>${["▤","☆","⌖","▣","♧","?","⚙"][i]} &nbsp;${x}</span><span>›</span></button>`).join("")}</div>`,"profile")}
let servicesOn=true;
function toggleServices(){servicesOn=!servicesOn;const el=document.getElementById('servicesToggle');if(el)el.classList.toggle('on',servicesOn);notify(servicesOn?'Services turned on':'Services turned off')}
function render(){
let r=route, html="";
if(r==="home")html=home();else if(r==="discover")html=discover();else if(r==="map")html=mapPage();else if(r==="cart")html=cartPage();else if(r==="checkout")html=checkout();else if(r==="payment")html=paymentPage();else if(r==="orders")html=ordersPage();else if(r==="loyalty")html=loyalty();else if(r==="profile")html=profile();else if(r.startsWith("store:"))html=storePage(r.split(":")[1]);else if(r.startsWith("product:"))html=productPage(r.split(":")[1]);else if(r.startsWith("order:"))html=orderPage(r.split(":")[1]);else html=home();root.innerHTML=html}
render();
setTimeout(()=>{const sp=document.getElementById("splash");if(sp)sp.classList.add("hide")},2300);
</script>
</body>
</html>

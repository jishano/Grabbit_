<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loco — Local Stores. Real Convenience.</title>
  <meta name="description" content="Loco local shopping prototype." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <div class="statusbar"><span>9:41</span><span>● ● ▰</span></div>

    <header class="topbar">
      <button class="icon-btn ghost" id="backBtn" aria-label="Back">‹</button>
      <div class="brand-mini"><span class="pin-logo">●</span><strong>Loco</strong></div>
      <button class="icon-btn" id="profileQuick" aria-label="Profile">☺</button>
    </header>

    <main id="app"></main>

    <nav class="bottom-nav">
      <button data-route="home" class="nav-item active"><span>⌂</span><small>Home</small></button>
      <button data-route="orders" class="nav-item"><span>▤</span><small>Orders</small></button>
      <button data-route="cart" class="nav-item cart-nav"><span>🛒<b id="cartBadge">0</b></span><small>Cart</small></button>
      <button data-route="loyalty" class="nav-item"><span>☆</span><small>Loyalty</small></button>
      <button data-route="profile" class="nav-item"><span>☰</span><small>More</small></button>
    </nav>
  </div>

  <div id="toast"></div>
  <div id="modalRoot"></div>
  <script src="script.js"></script>
</body>
</html>

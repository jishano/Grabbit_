<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Deploy</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
    }
    .box {
      padding: 40px;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }
    p {
      font-size: 1.2rem;
      opacity: 0.9;
    }
    button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: white;
      color: #764ba2;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>🎉 It's Live!</h1>
    <p>If you're seeing this, GitHub → Vercel is working.</p>
    <button onclick="sayHi()">Click me</button>
  </div>

  <script>
    function sayHi() {
      alert("JavaScript is working too!");
    }
  </script>
</body>
</html>

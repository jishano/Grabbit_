.screen{min-height:100vh;padding-bottom:100px}.top{height:92px;padding:13px 18px 10px;position:sticky;top:0;z-index:30;background:rgba(240,243,217,.94);backdrop-filter:blur(13px);border-bottom:1px solid rgba(216,223,190,.55)}
.status{font-size:12px;font-weight:700;display:flex;justify-content:space-between;padding:0 3px 9px}.toprow{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:8px;color:var(--plum);font-size:25px;font-weight:700;letter-spacing:-1px}.brandmark{width:25px;height:31px;border:4px solid var(--green);border-radius:60% 60% 60% 8%;transform:rotate(-45deg);position:relative}.brandmark:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--plum);left:5px;top:5px}.loc{border:0;background:transparent;color:var(--plum);font-size:13px;font-weight:700}.profile{border:0;background:var(--plum);color:#fff;width:39px;height:39px;border-radius:50%;font-size:21px}
.content{padding:16px 18px}.search{display:flex;align-items:center;gap:10px;border:1px solid #cbd5ab;background:var(--card);border-radius:999px;padding:11px 15px;margin:2px 0 16px;box-shadow:0 4px 12px rgba(60,80,40,.04)}.search input{border:0;outline:0;background:transparent;flex:1;color:var(--ink);min-width:0}.search span{font-size:20px;color:var(--green)}
.hero{border-radius:25px;background:linear-gradient(135deg,#e8efc9,#c9dcae);padding:22px;min-height:210px;position:relative;overflow:hidden;box-shadow:var(--shadow)}.hero:after{content:"🥬  🍅";position:absolute;right:0;bottom:8px;font-size:68px;transform:rotate(-5deg)}.hero h1{font:700 30px/1.03 "Playfair Display",serif;color:var(--plum);max-width:250px;margin:7px 0 10px}.hero p{font-size:12px;color:#5c6753;max-width:230px;line-height:1.45}.primary{border:0;background:var(--plum);color:#fff;border-radius:999px;padding:12px 17px;font-weight:700;box-shadow:0 8px 18px rgba(90,22,66,.18)}.secondary{border:1px solid #c8d2aa;background:var(--card);color:var(--green);border-radius:999px;padding:10px 14px;font-weight:700}
.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:24px 2px 12px}.sectionhead h2{font-size:19px;margin:0;color:var(--plum)}.link{border:0;background:transparent;color:var(--green);font-weight:700;font-size:12px}
.cats{display:flex;gap:12px;overflow:auto;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}.cat{border:0;background:transparent;min-width:70px;text-align:center;color:var(--ink);font-size:10px}.caticon{height:52px;width:52px;margin:0 auto 7px;border-radius:50%;display:grid;place-items:center;background:var(--sage);font-size:24px}.cat:active .caticon{background:var(--green);color:#fff}
.store-row{display:flex;gap:12px;overflow:auto;scrollbar-width:none}.store-row::-webkit-scrollbar{display:none}.store{min-width:190px;background:var(--card);border:1px solid var(--line);border-radius:19px;overflow:hidden;box-shadow:0 7px 18px rgba(55,72,40,.06);transition:.18s transform}.store:active{transform:scale(.985)}.storepic{height:105px;background-size:cover;background-position:center;position:relative}.heart{position:absolute;right:9px;top:9px;border:0;background:#fffff2dd;border-radius:50%;width:31px;height:31px;color:var(--plum);font-size:17px}.storeinfo{padding:10px}.storeinfo h3{font-size:14px;margin:0 0 5px}.meta{font-size:11px;color:var(--muted);line-height:1.45}.offer{display:inline-block;background:#e7efc8;color:#42632f;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:700;margin-top:7px}
.special{background:var(--plum);border-radius:22px;color:#fff;padding:18px;margin-top:20px;position:relative;overflow:hidden}.special:after{content:"🥕 🍅";position:absolute;right:4px;bottom:-3px;font-size:53px}.special h3{font:700 23px "Playfair Display",serif;margin:0 0 3px}.special p{font-size:12px;margin:0 0 12px;color:#f0dfe9}
.pagehead{padding:8px 0 5px}.pagehead h1{font:700 30px "Playfair Display",serif;color:var(--plum);margin:0}.pagehead p{font-size:12px;color:var(--muted)}
.filters{display:flex;gap:8px;overflow:auto;margin:13px 0 16px;scrollbar-width:none}.filter{border:1px solid #cbd5ab;background:var(--card);color:var(--green);border-radius:999px;padding:8px 12px;font-size:11px;white-space:nowrap}.filter.active{background:var(--green);color:#fff}
.storelist{display:grid;gap:11px}.storelist .store{display:flex;min-width:0}.storelist .storepic{width:110px;height:110px;flex:none}.storelist .storeinfo{padding:10px 8px}
.mapbox{height:260px;border-radius:25px;position:relative;overflow:hidden;background:#d7e6bd;border:1px solid #c7d5aa;box-shadow:var(--shadow);background-image:linear-gradient(28deg,transparent 45%,#b9d0a4 46%,#b9d0a4 49%,transparent 50%),linear-gradient(108deg,transparent 45%,#fff5d8 46%,#fff5d8 49%,transparent 50%),linear-gradient(7deg,transparent 48%,#b6caa1 49%,#b6caa1 51%,transparent 52%)}.mapriver{position:absolute;width:55px;height:330px;right:45px;top:-40px;background:#9ac8d0;transform:rotate(13deg);opacity:.8;border-radius:50%}.you{position:absolute;left:47%;top:46%;width:20px;height:20px;background:#3576e8;border:4px solid #fff;border-radius:50%;box-shadow:0 0 0 12px #3576e855}.mapmarker{position:absolute;background:var(--plum);color:#fff;border-radius:50% 50% 50% 0;width:35px;height:35px;transform:rotate(-45deg);display:grid;place-items:center;font-size:15px}.mapmarker span{transform:rotate(45deg)}.m1{left:18%;top:25%}.m2{left:68%;top:23%}.m3{left:24%;top:67%}.m4{left:73%;top:64%}.distancepill{position:absolute;background:#fff;color:var(--ink);border-radius:999px;padding:5px 8px;font-size:10px;box-shadow:0 4px 10px #0001}.d1{left:13%;top:39%}.d2{left:63%;top:37%}.d3{left:19%;top:81%}.d4{left:68%;top:78%}
.productgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.product{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 7px 17px rgba(55,72,40,.06)}.productpic{height:142px;background-size:cover;background-position:center}.productbody{padding:11px}.productbody h3{font-size:13px;margin:0 0 4px}.price{font-size:16px;font-weight:800;color:var(--plum)}.productbottom{display:flex;align-items:center;justify-content:space-between;margin-top:9px}.add{border:0;background:var(--green);color:#fff;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:700}
.detailpic{height:250px;border-radius:25px;background-size:cover;background-position:center}.detail{background:var(--card);border-radius:25px;padding:19px;margin-top:-20px;position:relative;box-shadow:var(--shadow)}.detail h1{font:700 30px "Playfair Display",serif;color:var(--plum);margin:0 0 4px}.actions{display:flex;gap:8px;margin:15px 0}.actions>*{flex:1}.qty{display:flex;align-items:center;gap:12px}.qty button{border:1px solid #cbd5ab;background:var(--bg);width:34px;height:34px;border-radius:50%;color:var(--green);font-weight:800}
.cartitem{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);padding:10px;border-radius:18px;margin-bottom:10px}.thumb{width:65px;height:65px;border-radius:13px;background-size:cover;background-position:center;flex:none}.cartcontrols{display:flex;gap:7px;align-items:center;margin-top:7px}.cartcontrols button{border:0;background:var(--sage);border-radius:50%;width:26px;height:26px}.summary{background:var(--card);border-radius:22px;padding:16px;margin-top:17px;border:1px solid var(--line)}.line{display:flex;justify-content:space-between;margin:8px 0;font-size:12px}.total{border-top:1px solid var(--line);padding-top:12px;color:var(--plum);font-weight:800;font-size:18px}.summary .primary{width:100%;margin-top:8px}

.slot{display:grid;gap:8px}.slot button{border:1px solid #ccd6ad;background:var(--card);border-radius:15px;padding:13px;text-align:left}.slot button.selected{background:var(--green);border-color:var(--green);color:#fff}
.statuscard{background:linear-gradient(135deg,#dfeabd,#f9f8df);border:1px solid #d0dcb1;border-radius:22px;padding:16px}.step{display:flex;gap:10px;align-items:flex-start;margin:12px 0}.dot{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;font-size:11px;flex:none}.dot.pending{background:#cfd8b6;color:#59634c}
.qr{width:150px;height:150px;margin:14px auto;background:repeating-conic-gradient(#2a3028 0 8deg,#fff 8deg 16deg);border:10px solid #fff;box-shadow:0 3px 15px #0002}.otp{font-size:27px;letter-spacing:7px;text-align:center;color:var(--plum);font-weight:800;background:#f0f3d9;border-radius:15px;padding:12px;margin:10px 0}
.profilecard{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#dce9bc,#f9f8df);border-radius:23px;padding:20px}.avatar{width:61px;height:61px;border-radius:50%;display:grid;place-items:center;background:var(--plum);color:#fff;font-size:25px}.menu{background:var(--card);border-radius:21px;margin-top:14px;overflow:hidden;border:1px solid var(--line)}.menu button{display:flex;justify-content:space-between;width:100%;padding:15px;border:0;border-bottom:1px solid #e1e6d2;background:transparent;text-align:left;color:var(--ink)}.menu button:last-child{border-bottom:0}
.points{background:var(--green);color:#fff;border-radius:24px;padding:22px}.points strong{display:block;font-size:40px;margin:2px 0}.progress{height:8px;background:#ffffff3a;border-radius:99px;overflow:hidden;margin-top:15px}.progress i{display:block;height:100%;width:50%;background:#e2efb8}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);height:79px;background:#fbfbeaee;backdrop-filter:blur(15px);border-top:1px solid #d9dfc6;z-index:40;display:flex;justify-content:space-around;padding-top:8px}.nav{border:0;background:transparent;color:#687160;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:21px;min-width:58px}.nav small{font-size:10px;font-weight:600}.nav.active{color:var(--plum)}.cartbadge{position:absolute;background:var(--plum);color:#fff;font-size:9px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;margin:0 0 0 22px}
.toast{position:fixed;z-index:100;left:50%;bottom:93px;transform:translate(-50%,20px);opacity:0;background:#273527;color:#fff;border-radius:999px;padding:11px 15px;font-size:11px;pointer-events:none;transition:.25s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}

.modalwrap{position:fixed;inset:0;background:#27352766;z-index:150;display:grid;place-items:end center}.modal{width:min(100%,520px);background:var(--bg);border-radius:28px 28px 0 0;padding:20px;animation:up .25s ease}.modal h2{color:var(--plum);margin:0 0 8px;font:700 24px "Playfair Display",serif}.note{background:#f4e9ee;border-left:4px solid var(--plum);padding:12px;border-radius:12px;font-size:12px}.alt{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}
.fade{animation:fade .3s ease}@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes hop{from{transform:translateY(0) rotate(-1deg)}to{transform:translateY(-11px) rotate(1deg)}}@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}@keyframes run{0%{transform:translateX(-5px) rotate(-2deg)}50%{transform:translateX(5px) rotate(2deg)}100%{transform:translateX(-5px) rotate(-2deg)}}
@media(min-width:700px){.app{margin:20px auto;border-radius:34px;min-height:calc(100vh - 40px)}.bottom{bottom:20px;border-radius:0 0 30px 30px}}

let cart=JSON.parse(localStorage.getItem("loco_cart")||"[]");
let orders=JSON.parse(localStorage.getItem("loco_orders")||"[]");
let favs=JSON.parse(localStorage.getItem("loco_favs")||"[]");
let route="home", lastRoute="home", selectedPay="cod", selectedSlot="Today • 4:00 PM – 5:00 PM";

const root=document.getElementById("root"), toast=document.getElementById("toast"), overlay=document.getElementById("overlay");
function save(){localStorage.setItem("loco_cart",JSON.stringify(cart));localStorage.setItem("loco_orders",JSON.stringify(orders));localStorage.setItem("loco_favs",JSON.stringify(favs))}
function getStore(id){return stores.find(s=>s.id===id)}
function getProduct(id){return products.find(p=>p.id===id)}
function money(n){return "₹"+n.toLocaleString("en-IN")}
function qty(id){const x=cart.find(a=>a.id===id);return x?x.qty:0}
function cartCount(){return cart.reduce((s,x)=>s+x.qty,0)}
function subtotal(){return cart.reduce((s,x)=>s+getProduct(x.id).price*x.qty,0)}
function notify(t){toast.textContent=t;toast.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>toast.classList.remove("show"),1800)}
function nav(r){lastRoute=route;route=r;render()}
function goBack(){nav(lastRoute||"home")}
function toggleFav(id){favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];save();notify(favs.includes(id)?"Added to favourites ♥":"Removed from favourites");render()}
function add(id,n=1){let x=cart.find(a=>a.id===id);if(x)x.qty+=n;else cart.push({id,qty:n});save();notify(getProduct(id).name+" added to cart ✓");render()}
function changeCart(id,n){const x=cart.find(a=>a.id===id);if(!x)return;x.qty+=n;if(x.qty<=0)cart=cart.filter(a=>a.id!==id);save();render()}
function clearCart(){cart=[];save()}
function storeCard(s){return `<article class="store" onclick="nav('store:${s.id}')"><div class="storepic" style="background-image:url('${s.img}')"><button class="heart" onclick="event.stopPropagation();toggleFav('${s.id}')">${favs.includes(s.id)?"♥":"♡"}</button></div><div class="storeinfo"><h3>${s.name}</h3><div class="meta">⌖ ${s.distance} from Christ College</div><div class="meta">★ ${s.rating} (${s.reviews})</div><div class="meta">${s.cat}</div><span class="offer">${s.offer}</span></div></article>`}
function productCard(p){return `<article class="product" onclick="nav('product:${p.id}')"><div class="productpic" style="background-image:url('${p.img}')"></div><div class="productbody"><h3>${p.name}</h3><div class="price">${money(p.price)}</div><div class="meta">${p.unavailable?"May be unavailable":"In stock"} • ${getStore(p.store).name}</div><div class="productbottom"><span class="meta">★ 4.6</span><button class="add" onclick="event.stopPropagation();add('${p.id}')">Add +</button></div></div></article>`}
function navBar(active){return `<nav class="bottom">
<button class="nav ${active==='home'?'active':''}" onclick="nav('home')">⌂<small>Home</small></button>
<button class="nav ${active==='orders'?'active':''}" onclick="nav('orders')">▤<small>Orders</small></button>
<button class="nav ${active==='cart'?'active':''}" onclick="nav('cart')"><span style="position:relative">🛒${cartCount()?`<b class="cartbadge">${cartCount()}</b>`:""}</span><small>Cart</small></button>
<button class="nav ${active==='loyalty'?'active':''}" onclick="nav('loyalty')">☆<small>Loyalty</small></button>
<button class="nav ${active==='profile'?'active':''}" onclick="nav('profile')">☰<small>More</small></button></nav>`}
function shell(content,active="home",back=false){return `<div class="screen"><header class="top"><div class="status"><span>9:41</span><span>● ● ▰</span></div><div class="toprow"><button class="loc" onclick="${back?"goBack()":"nav('home')"}">${back?"‹ Back":"Loco"}</button><div class="brand"><span class="brandmark"></span>Loco</div><button class="profile" onclick="nav('profile')">☺</button></div></header><main class="content">${content}</main>${navBar(active)}</div>`}

function home(){
return shell(`<div class="search"><span>⌕</span><input id="q" placeholder="Search products or stores..." oninput="searchHome(this.value)"><span>◉</span></div>
<section class="hero"><h1>Find it. Reserve it. Pick it up.</h1><p>Discover local stores around Christ College, check products and reserve what you need.</p><button class="primary" onclick="nav('discover')">Discover Stores →</button></section>
<div id="searchOut"></div>
<div class="sectionhead"><h2>Categories</h2><button class="link" onclick="nav('discover')">View all →</button></div>
<div class="cats">${[["📚","Stationery"],["🧸","Baby Care"],["🥦","Groceries"],["🧴","Essentials"],["🎁","Gifts"],["＋","More"]].map(x=>`<button class="cat" onclick="category('${x[1]}')"><div class="caticon">${x[0]}</div>${x[1]}</button>`).join("")}</div>
<div class="sectionhead"><h2>Recently Purchased Stores</h2><button class="link" onclick="nav('discover')">Discover →</button></div>
<div class="store-row">${stores.slice(0,2).map(storeCard).join("")}</div>
<section class="special"><h3>Student Essentials</h3><p>Find notebooks, pens, files and more from stores near campus.</p><button class="secondary" onclick="nav('store:christ')">Shop Christ Stationary</button></section>`);
}
function searchHome(q){const out=document.getElementById("searchOut");if(!out)return;if(!q.trim()){out.innerHTML="";return}let z=q.toLowerCase();let ss=stores.filter(s=>(s.name+" "+s.cat).toLowerCase().includes(z));let ps=products.filter(p=>p.name.toLowerCase().includes(z));out.innerHTML=`<div class="sectionhead"><h2>Search</h2></div>${ss.map(storeCard).join("")}${ps.length?`<div class="productgrid" style="margin-top:10px">${ps.map(productCard).join("")}</div>`:""}${!ss.length&&!ps.length?`<p class="meta">No results found.</p>`:""}`}
function category(c){const map={"Stationery":"christ","Baby Care":"akp","Groceries":"green"};nav("store:"+map[c]||"discover")}

function discover(){
return shell(`<div class="pagehead"><h1>Discover Stores</h1><p>Stores around Christ College • live demo distances</p></div>
<div class="mapbox"><div class="mapriver"></div><div class="you"></div>${[["m1","d1","50 m"],["m2","d2","500 m"],["m3","d3","680 m"],["m4","d4","720 m"]].map((x,i)=>`<div class="mapmarker ${x[0]}"><span>⌖</span></div><span class="distancepill ${x[1]}">${x[2]}</span>`).join("")}</div>
<div class="filters"><button class="filter active">All</button><button class="filter" onclick="filterDiscover('Stationery')">Stationery</button><button class="filter" onclick="filterDiscover('Baby')">Baby</button><button class="filter" onclick="filterDiscover('Groceries')">Groceries</button></div>
<div class="storelist" id="discoverList">${stores.map(s=>`<article class="store" onclick="nav('store:${s.id}')"><div class="storepic" style="background-image:url('${s.img}')"></div><div class="storeinfo"><h3>${s.name}</h3><div class="meta">⌖ ${s.distance} from Christ College</div><div class="meta">★ ${s.rating} (${s.reviews})</div><div class="meta">${s.cat}</div><span class="offer">${s.offer}</span></div></article>`).join("")}</div>`);
}
function filterDiscover(q){const a=stores.filter(s=>(s.name+s.cat).toLowerCase().includes(q.toLowerCase()));document.getElementById("discoverList").innerHTML=a.map(s=>`<article class="store" onclick="nav('store:${s.id}')"><div class="storepic" style="background-image:url('${s.img}')"></div><div class="storeinfo"><h3>${s.name}</h3><div class="meta">⌖ ${s.distance} from Christ College</div><div class="meta">★ ${s.rating}</div><div class="meta">${s.cat}</div></div></article>`).join("")}

function storePage(id){
const s=getStore(id), ps=products.filter(p=>p.store===id);
return shell(`<div class="detailpic" style="background-image:url('${s.img}')"></div><section class="detail"><div style="display:flex;justify-content:space-between;gap:10px"><div><h1>${s.name}</h1><div class="meta">⌖ ${s.distance} from Christ College • ${s.status}</div><div class="rating" style="color:var(--gold);font-size:12px;margin-top:5px">★ ${s.rating} (${s.reviews})</div></div><button class="heart" style="position:static" onclick="toggleFav('${s.id}')">${favs.includes(s.id)?"♥":"♡"}</button></div>
<div class="actions"><button class="secondary" onclick="notify('Directions opened — demo')">⌖ ${s.distance}</button><button class="secondary" onclick="notify('Calling ${s.name}…')">☎ Call</button><button class="secondary" onclick="notify('Store link copied')">↗ Share</button></div>
<div class="sectionhead"><h2>Products</h2><span class="meta">${ps.length} items</span></div><div class="productgrid">${ps.map(productCard).join("")}</div>
<div class="sectionhead"><h2>About</h2></div><p class="meta">${id==="christ"?"A campus-friendly stationery store with notebooks, writing supplies, files and art essentials.":"A neighbourhood baby store with baby-care essentials, toys and feeding products."}</p>
</section>`, "home", true)
}
function productPage(id){
const p=getProduct(id),s=getStore(p.store);
return shell(`<div class="detailpic" style="background-image:url('${p.img}')"></div><section class="detail"><h1>${p.name}</h1><div class="price">${money(p.price)}</div><div class="meta" style="margin-top:6px">⌖ ${s.name} • ${s.distance} from Christ College</div><p class="meta" style="margin-top:12px">${p.unavailable?"This item is shown as a demo item that may be unavailable during seller confirmation.":"Available from the selected local store."}</p>
<div class="sectionhead"><h2>Quantity</h2><div class="qty"><button onclick="changeTemp(-1)">−</button><strong id="tqty">1</strong><button onclick="changeTemp(1)">+</button></div></div>
<div class="actions"><button class="primary" onclick="addTemp('${p.id}')">Add to Cart</button><button class="secondary" onclick="addTemp('${p.id}');nav('cart')">Reserve at Store</button></div>
<div class="sectionhead"><h2>Store</h2></div><button class="secondary" style="width:100%" onclick="nav('store:${s.id}')">${s.name} • ${s.distance} away →</button></section>`,"home",true)
}
let tempQty=1;function changeTemp(n){tempQty=Math.max(1,tempQty+n);const e=document.getElementById("tqty");if(e)e.textContent=tempQty}function addTemp(id){add(id,tempQty);tempQty=1}

function cartPage(){
if(!cart.length)return shell(`<div style="text-align:center;padding:55px 10px"><div style="font-size:60px">🛒</div><h1 style="font:700 29px 'Playfair Display',serif;color:var(--plum)">Your cart is empty</h1><p class="meta">Find a local store and reserve what you need.</p><button class="primary" onclick="nav('discover')">Discover Stores</button></div>`,"cart");
return shell(`<div class="pagehead"><h1>Your Cart</h1><p>Review your items before sending the request to the seller.</p></div>
${cart.map(x=>{let p=getProduct(x.id);return `<div class="cartitem"><div class="thumb" style="background-image:url('${p.img}')"></div><div style="flex:1"><h3 style="font-size:13px;margin:0">${p.name}</h3><div class="price">${money(p.price)}</div><div class="meta">${getStore(p.store).name} • ${getStore(p.store).distance}</div><div class="cartcontrols"><button onclick="changeCart('${p.id}',-1)">−</button><strong>${x.qty}</strong><button onclick="changeCart('${p.id}',1)">+</button><button style="margin-left:auto" onclick="changeCart('${p.id}',-${x.qty})">✕</button></div></div></div>`}).join("")}
<div class="summary"><div class="line"><span>Items</span><strong>${cartCount()}</strong></div><div class="line"><span>Subtotal</span><strong>${money(subtotal())}</strong></div><div class="line"><span>Reservation / pickup fee</span><strong>₹0</strong></div><div class="line total"><span>Total</span><strong>${money(subtotal())}</strong></div><button class="primary" onclick="nav('checkout')">Send for Confirmation →</button></div>`,"cart")
}
function checkout(){
const christ=cart.every(x=>getProduct(x.id).store==="christ");
return shell(`<div class="pagehead"><h1>Confirm Your Order</h1><p>We'll send your request to the seller for confirmation.</p></div>
<div class="statuscard"><strong>Pickup store</strong><h2 style="margin:5px 0;color:var(--plum)">${christ?"Christ Stationary":"AKP Baby Store"}</h2><div class="meta">⌖ ${christ?"50 m":"500 m"} from Christ College</div><div class="meta">Items will be reserved for pickup after seller confirmation.</div></div>
<div class="sectionhead"><h2>Payment Method</h2></div><div class="payment">${[["cod","💵","Pay on Pickup","Pay when you collect"],["upi","📱","UPI","Google Pay / PhonePe"],["card","💳","Credit / Debit Card","Secure demo payment"],["net","🏦","Net Banking","Bank transfer"]].map(x=>`<button class="pay ${selectedPay===x[0]?"selected":""}" onclick="selectPay('${x[0]}')"><strong>${x[1]} ${x[2]}</strong><span>${x[3]}</span></button>`).join("")}</div>
<div class="sectionhead"><h2>Pickup Preference</h2></div><div class="slot">${["Today • 4:00 PM – 5:00 PM","Today • 5:00 PM – 6:00 PM","Tomorrow • 10:00 AM – 11:00 AM"].map(x=>`<button class="${selectedSlot===x?"selected":""}" onclick="selectSlot('${x}')">${x}</button>`).join("")}</div>
<div class="summary"><div class="line"><span>Total</span><strong>${money(subtotal())}</strong></div><button class="primary" onclick="sendConfirmation()">Send to Seller for Confirmation</button></div>`,"cart",true)
}
function selectPay(x){selectedPay=x;render()}function selectSlot(x){selectedSlot=x;render()}
function sendConfirmation(){
showLoading("Sending to seller…","Your order is being sent to the store",5000,()=>{
const hasAKP=cart.some(x=>getProduct(x.id).store==="akp");
if(hasAKP)showUnavailable();else createOrder("confirmed");
});
}
function showLoading(title,sub,ms,done){
overlay.innerHTML=`<div class="loadingbox"><img class="mascot" src="${mascot}"><h2>${title}</h2><p>${sub}</p><div class="loader"><i></i></div><div class="count" id="loadCount">Please wait…</div></div>`;
const bar=overlay.querySelector(".loader i"),count=overlay.querySelector("#loadCount");let start=Date.now();
let iv=setInterval(()=>{let pct=Math.min(100,((Date.now()-start)/ms)*100);bar.style.width=pct+"%";count.textContent=Math.ceil((ms-(Date.now()-start))/1000)+"s";if(pct>=100){clearInterval(iv);setTimeout(()=>{overlay.innerHTML="";done()},250)}},100);
}
function showUnavailable(){
const unavailable=cart.filter(x=>getProduct(x.id).unavailable);const available=cart.filter(x=>!getProduct(x.id).unavailable);
overlay.innerHTML=`<div class="modalwrap"><div class="modal"><div style="font-size:35px">⚠️</div><h2>Seller responded</h2><p class="meta">AKP Baby Store reviewed your request.</p><div class="note"><strong>Seller note:</strong><br>The Baby Diapers — M item is currently unavailable. We can offer a similar size/brand instead.</div><div class="sectionhead"><h3 style="margin:0;color:var(--plum)">Suggested alternative</h3></div><div class="alt"><div><strong>Baby Diapers — L</strong><div class="meta">₹549 • Similar option</div></div><button class="small-btn" onclick="acceptAlternative()">Accept</button></div><button class="secondary" style="width:100%;margin-top:7px" onclick="keepAvailableOnly()">Take the rest of my items</button><button class="link" style="width:100%;padding:12px" onclick="quitUnavailable()">Quit this order</button></div></div>`;
}
function acceptAlternative(){let bad=cart.find(x=>getProduct(x.id).unavailable);if(bad){bad.id="diapers-alt"}; // temporary object
const alt={id:"diapers-alt",store:"akp",name:"Baby Diapers — L",price:549,cat:"Baby Care",img:"https://images.unsplash.com/photo-1584839404042-8bc21d240e95?auto=format&fit=crop&w=700&q=80"};products.push(alt);save();overlay.innerHTML="";createOrder("confirmed","Alternative accepted");}
function keepAvailableOnly(){cart=cart.filter(x=>!getProduct(x.id).unavailable);save();overlay.innerHTML="";createOrder("confirmed","Unavailable item removed")}
function quitUnavailable(){clearCart();overlay.innerHTML="";notify("Order request cancelled");nav("home")}
function createOrder(status="confirmed",note=""){
const items=cart.map(x=>({id:x.id,qty:x.qty})), total=subtotal();const id="LOCO-"+Math.floor(100000+Math.random()*899999);const storeId=items.length?getProduct(items[0].id).store:"christ";orders.unshift({id,store:storeId,total,items,pay:selectedPay,slot:selectedSlot,status,note,date:"Today",distance:getStore(storeId).distance});clearCart();save();nav("order:"+id)
}
function orderPage(id){
const o=orders.find(x=>x.id===id)||orders[0];if(!o)return nav("orders");const s=getStore(o.store);
return shell(`<div class="pagehead"><h1>Order Confirmed ✓</h1><p>Your reservation is ready in your Loco order.</p></div>
<div class="statuscard"><div style="display:flex;justify-content:space-between"><strong>${s.name}</strong><span class="offer">${o.status==="confirmed"?"Confirmed":"Pending"}</span></div><div class="meta">⌖ ${s.distance} from Christ College</div><div class="meta">Pickup: ${o.slot}</div><div class="meta">Payment: ${o.pay==="cod"?"Pay on Pickup":o.pay.toUpperCase()}</div>${o.note?`<div class="note" style="margin-top:12px">${o.note}</div>`:""}</div>
<div class="sectionhead"><h2>Pickup QR</h2><button class="link" onclick="notify('QR saved — demo')">Save</button></div><div class="qr" title="Demo QR"></div><p class="meta" style="text-align:center">Show this QR at the store when you collect your order.</p>
<div class="sectionhead"><h2>Pickup OTP</h2></div><div class="otp" id="otp">••••••</div><button class="secondary" style="width:100%" onclick="generateOtp('${o.id}')">Generate OTP</button>
<div class="sectionhead"><h2>Items</h2></div>${o.items.map(x=>{let p=getProduct(x.id);return `<div class="line"><span>${p.name} × ${x.qty}</span><strong>${money(p.price*x.qty)}</strong></div>`}).join("")}
<div class="summary"><div class="line total"><span>Total</span><strong>${money(o.total)}</strong></div></div>`,"orders",true)
}
function generateOtp(id){const otp=Math.floor(100000+Math.random()*900000);document.getElementById("otp").textContent=otp;notify("Pickup OTP generated")}
function ordersPage(){
return shell(`<div class="pagehead"><h1>Orders</h1><p>Your reservations, confirmations and pickup details.</p></div>${orders.length?orders.map(o=>{let s=getStore(o.store);return `<article class="order-card" style="background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:11px" onclick="nav('order:${o.id}')"><div style="display:flex;justify-content:space-between"><strong>${s.name}</strong><span class="offer">${o.status==="confirmed"?"Confirmed":"Pending"}</span></div><div class="meta">⌖ ${s.distance} from Christ College</div><div class="meta">${o.date} • ${o.slot}</div><div class="line" style="margin-top:11px"><span>${o.items.length} product${o.items.length>1?"s":""}</span><strong>${money(o.total)}</strong></div><button class="secondary" style="width:100%;margin-top:6px">View QR & OTP →</button></article>`}).join(""):`<div class="summary"><h3>No orders yet</h3><p class="meta">Your confirmed reservations will appear here.</p><button class="primary" onclick="nav('discover')">Find a Store</button></div>`}`,"orders")
}
function loyalty(){return shell(`<div class="pagehead"><h1>Loco Loyalty</h1><p>Rewards for choosing local.</p></div><div class="points"><span>Current Points</span><strong>250</strong><span>250 / 500 points to next reward</span><div class="progress"><i></i></div></div><div class="sectionhead"><h2>Rewards</h2></div><div class="summary"><strong>₹50 Off</strong><div class="meta">500 points • 250 more to unlock</div></div><div class="summary"><strong>₹100 Off</strong><div class="meta">900 points • 650 more to unlock</div></div>`,"loyalty")}
function profile(){return shell(`<div class="profilecard"><div class="avatar">☺</div><div><h2 style="margin:0;color:var(--plum)">Jishan MJ</h2><div class="meta">Local shopper • 250 points</div></div></div><div class="menu">${["My Orders","Loyalty Points","Addresses","Payment Methods","Notifications","Help & Support","Settings"].map((x,i)=>`<button onclick="${x==="My Orders"?"nav('orders')":x==="Loyalty Points"?"nav('loyalty')":"notify('"+x+" — demo screen')"}"><span>${["▤","☆","⌖","▣","♧","?","⚙"][i]} &nbsp;${x}</span><span>›</span></button>`).join("")}</div>`,"profile")}
function render(){
let r=route, html="";
if(r==="home")html=home();else if(r==="discover")html=discover();else if(r==="cart")html=cartPage();else if(r==="checkout")html=checkout();else if(r==="orders")html=ordersPage();else if(r==="loyalty")html=loyalty();else if(r==="profile")html=profile();else if(r.startsWith("store:"))html=storePage(r.split(":")[1]);else if(r.startsWith("product:"))html=productPage(r.split(":")[1]);else if(r.startsWith("order:"))html=orderPage(r.split(":")[1]);else html=home();root.innerHTML=html}
render();
</script>
</body>
</html>
